name: daily refresh

on:
  schedule:
    - cron: "30 0 * * *" # 08:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Paint today's landscape
        run: node scripts/ink.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Defiabell
        run: python scripts/cards.py
      - name: Poem of the day
        run: python scripts/poem.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: refresh $(TZ=Asia/Shanghai date +%F)"
          git push
